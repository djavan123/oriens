<!DOCTYPE html>
<html lang="pt-BR" x-data="{ theme: localStorage.getItem('oriens-theme') || 'dark' }"
  x-init="$watch('theme', v => { localStorage.setItem('oriens-theme', v); document.documentElement.setAttribute('data-theme', v) })">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}Oriens{% endblock %}</title>

  <!-- Tema: aplica data-theme antes de qualquer CSS para não piscar -->
  <script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('oriens-theme')||'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}})();</script>
  <link rel="stylesheet" href="/static/css/theme.css?v={{ app_version }}">

  <!-- CSS do app: gerado no build por `npm run build:css` (tailwind.src.css →
       tailwind.css). Antes o Tailwind vinha como compilador de runtime de
       407 KB, síncrono, aqui no <head>: ele varria o DOM e gerava a folha de
       estilo no navegador a cada carga (~3 s de tela sem estilo) e recompilava
       a cada swap do HTMX, via MutationObserver. Agora é só um arquivo. -->
  <link rel="stylesheet" href="/static/css/tailwind.css?v={{ app_version }}">

  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.webmanifest?v={{ app_version }}">
  <meta name="theme-color" content="#191919">
  <link rel="icon" href="/static/icon.svg?v={{ app_version }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg?v={{ app_version }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Oriens">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- A configuração do Tailwind (cores oriens-*, fonte) vive em
       tailwind.config.js, na raiz do repo, e é consumida no build. -->

  <!-- Fonte Inter auto-hospedada (sem CDN — PWA funciona offline) -->
  <link href="/static/vendor/fonts/inter.css?v={{ app_version }}" rel="stylesheet">

  <script src="/static/vendor/htmx.min.js?v={{ app_version }}" defer></script>
  <script src="/static/vendor/alpine.min.js?v={{ app_version }}" defer></script>

  {% block head %}{% endblock %}
</head>
<body class="antialiased min-h-screen">

  {% block body %}{% endblock %}

  <script>
    // Service worker DESLIGADO. O registro antigo apontava para /static/sw.js sem
    // `scope`, então seu escopo era /static/ — ele nunca controlou as páginas e o
    // "PWA offline" nunca existiu de fato. Aqui só limpamos o legado que ficou nos
    // navegadores: desregistra o SW órfão e apaga os caches que ele criou.
    // O app segue instalável (manifest), agora sem cache offline.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (ks) {
        ks.forEach(function (k) { if (k.indexOf("oriens-static") === 0) caches.delete(k); });
      }).catch(function () {});
    }
  </script>
</body>
</html>
